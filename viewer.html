<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF page</title>
  <style>
    html, body { margin: 0; padding: 0; background: #525659; overflow: hidden; }
    #wrap { display: inline-block; line-height: 0; }
    #the-canvas { display: block; vertical-align: top; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div id="wrap"><canvas id="the-canvas"></canvas></div>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const file = params.get("file");
      const pageNum = Math.max(1, parseInt(params.get("page") || "1", 10) || 1);
      const scale = Math.max(0.5, parseFloat(params.get("scale") || "2") || 2);

      if (!file) {
        document.body.setAttribute("data-error", "missing-file");
        return;
      }

      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

      const loadingTask = pdfjsLib.getDocument({ url: file });
      const pdf = await loadingTask.promise;
      if (pageNum > pdf.numPages) {
        document.body.setAttribute("data-error", "page-out-of-range");
        return;
      }

      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: scale });
      const canvas = document.getElementById("the-canvas");
      const ctx = canvas.getContext("2d");
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
      document.body.setAttribute("data-ready", "1");
    })().catch(function (e) {
      document.body.setAttribute("data-error", String(e && e.message ? e.message : e));
    });
  </script>
</body>
</html>
